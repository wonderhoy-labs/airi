[package]
name = "airi-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1"
hmac = "0.13"
libc = "0.2"
lz4_flex = { version = "0.14", default-features = false, features = ["std"] }
rand = "0.10"
resvg = { version = "0.49", default-features = false, features = ["text", "system-fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
smithay = { version = "0.7", default-features = false, features = ["desktop", "wayland_frontend", "xwayland", "renderer_pixman"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
