[workspace]
resolver = "3"
members = ["crates/airi-agent", "crates/airi-viewer"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/wonderhoy-labs/airi"
publish = false
rust-version = "1.88"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
panic = "abort"
